<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>找到了旅行社 - 業務行程管理中心 (視覺化版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #d63384;
            --primary-dark: #a61e61;
            --dark: #1a1a2e;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            background: #f0f2f5;
            display: flex;
            color: #333;
        }

        .sidebar {
            width: 260px;
            background: var(--dark);
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .nav-item {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 8px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .nav-item.active {
            background: var(--primary);
            opacity: 1;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
            flex: 1;
            width: calc(100% - 260px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        /* 表單元素 */
        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        label {
            font-weight: 800;
            color: var(--dark);
            display: block;
            margin-top: 15px;
        }

        /* 視覺化列表樣式 */
        .dynamic-row {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            margin-bottom: 15px;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ff4757;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .add-btn {
            background: #2ecc71;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }

        /* 每日行程表單優化 */
        .day-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .day-title-row {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-info {
            background: #0097e6;
            color: white;
            width: 100%;
            justify-content: center;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: 20px;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>找到管理中心</h2>
        <div class="nav-item active" onclick="location.reload()"><i class="fa-solid fa-map-location-dot"></i> 行程管理</div>
        <div class="nav-item" onclick="window.open('index.html')"><i class="fa-solid fa-house"></i> 前往首頁</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>旅遊行程發佈中心</h1>
            <button class="btn btn-primary" onclick="showModal()"><i class="fa-solid fa-plus"></i> 手動建立行程</button>
        </div>

        <!-- 快速解析 -->
        <div class="card">
            <h3><i class="fa-solid fa-bolt" style="color:#fbc531"></i> 智慧文案解析</h3>
            <textarea id="quickPasteText" rows="4" placeholder="請貼上 LINE/FB 文案..."></textarea>
            <button class="btn btn-info" onclick="handleQuickParse()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 智慧填入表單
            </button>
        </div>

        <!-- 行程列表 -->
        <div class="card">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; background: #f8f9fa;">
                        <th style="padding:15px;">行程名稱</th>
                        <th>航空</th>
                        <th>售價</th>
                        <th>管理</th>
                    </tr>
                </thead>
                <tbody id="tourTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 視覺化編輯彈窗 -->
    <div id="tourModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">編輯行程詳細資訊</h2>
            <hr>

            <form id="tourForm">
                <input type="hidden" id="tourId">

                <label>行程標題</label>
                <input type="text" id="title" required>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                    <div><label>最低價格</label><input type="number" id="price" required></div>
                    <div><label>航空公司</label><input type="text" id="airline"></div>
                    <div><label>封面圖片網址</label><input type="text" id="image"></div>
                </div>

                <label>標籤 (多個請用逗號隔開)</label>
                <input type="text" id="tagsInput" placeholder="例如：無購物, 星宇航空, 季節限定">

                <label>行程特色亮點 (視覺化列表)</label>
                <div id="highlightsList"></div>
                <button type="button" class="add-btn" onclick="addHighlightRow()"><i class="fa-solid fa-plus"></i>
                    增加亮點</button>

                <label>每日行程明細 (視覺化列表)</label>
                <div id="itineraryList"></div>
                <button type="button" class="add-btn" onclick="addItineraryRow()"><i class="fa-solid fa-plus"></i>
                    增加一天行程</button>

                <label>費用說明與備註 (不含 Emoji)</label>
                <textarea id="description" rows="5"></textarea>

                <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
                    <button type="button" class="btn" style="background:#eee;" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">儲存並更新官網</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://luozejormlpayqbcvwis.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b3plam9ybWxwYXlxYmN2d2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3NTY4NDQsImV4cCI6MjA4NjMzMjg0NH0.ASyVqZRPZeZtGKB2r_P0fEOhVczY0eptpHHy7jff08c";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // --- 輔助函式：徹底移除 Emoji ---
        function stripEmojis(str) {
            if (!str) return "";
            return str.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{1F000}-\u{1Faff}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}]/gu, '').trim();
        }

        // --- 核心：亮點與行程的 UI 渲染器 ---

        function addHighlightRow(data = { title: '', desc: '', img: '' }) {
            const container = document.getElementById('highlightsList');
            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `
                <i class="fa-solid fa-circle-xmark remove-btn" onclick="this.parentElement.remove()"></i>
                <div style="display:flex; gap:10px;">
                    <input type="text" placeholder="亮點標題" value="${stripEmojis(data.title)}" class="h-title" style="flex:1">
                    <input type="text" placeholder="分類 (如:美食/玩樂)" value="${stripEmojis(data.desc)}" class="h-desc" style="width:150px">
                </div>
                <input type="text" placeholder="亮點圖片網址 (可選)" value="${data.img}" class="h-img">
            `;
            container.appendChild(div);
        }

        function addItineraryRow(data = { day: 0, title: '', spots: [], breakfast: '', lunch: '', dinner: '', hotel: '' }) {
            const container = document.getElementById('itineraryList');
            const index = container.children.length;
            const displayDay = data.day || (index + 1);

            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `
                <i class="fa-solid fa-circle-xmark remove-btn" onclick="this.parentElement.remove()"></i>
                <div class="day-title-row">
                    <strong>第 ${displayDay} 天</strong>
                    <input type="text" placeholder="當日行程大標題" value="${stripEmojis(data.title)}" class="i-title" style="flex:1; margin:0;">
                </div>
                <textarea placeholder="當日景點清單 (一列一個景點)" class="i-spots" rows="2">${data.spots ? data.spots.map(s => stripEmojis(s)).join('\n') : ''}</textarea>
                <div class="day-form-grid">
                    <input type="text" placeholder="早餐" value="${stripEmojis(data.breakfast)}" class="i-breakfast">
                    <input type="text" placeholder="午餐" value="${stripEmojis(data.lunch)}" class="i-lunch">
                    <input type="text" placeholder="晚餐" value="${stripEmojis(data.dinner)}" class="i-dinner">
                </div>
                <input type="text" placeholder="下榻飯店" value="${stripEmojis(data.hotel)}" class="i-hotel">
            `;
            container.appendChild(div);
        }

        // --- 核心：智慧文案解析邏輯 (優化版) ---

        function handleQuickParse() {
            const raw = document.getElementById('quickPasteText').value;
            if (!raw.trim()) return alert("請先貼上文案內容");

            const lines = raw.split('\n').map(l => l.trim()).filter(l => l);

            // 1. 標題識別 (取第一行，移除 Emoji)
            const title = stripEmojis(lines[0]).split('－')[0].split('-')[0].trim();

            // 2. 航空公司識別 (擴大搜尋常見航空)
            let airline = "精選航空";
            const AIRLINE_LIST = ["星宇", "長榮", "華航", "酷航", "越捷", "虎航", "易斯達", "德威", "韓亞", "大韓", "國泰", "澳門"];
            const foundAir = AIRLINE_LIST.find(name => raw.includes(name));
            if (foundAir) airline = foundAir + "航空";

            // 3. 天數識別 (例如: 9日 或 9天)
            const dayMatch = raw.match(/(\d+)\s*[日天]/);
            const dayCount = dayMatch ? parseInt(dayMatch[1]) : 5;

            // 4. 價格識別 (尋找數字)
            const priceRegex = /(?:團費|售價|只要|價|[\$￥])[:：]?\s*(\d{1,3}(?:,\d{3})*)/;
            const priceMatch = raw.replace(/,/g, '').match(priceRegex);
            const price = priceMatch ? parseInt(priceMatch[1]) : 0;

            // 5. 每日行程解析 (段落切割)
            const dayBlocks = raw.split(/第\s?\d+\s?天/);
            const descriptionBlock = stripEmojis(dayBlocks[0].trim());

            // 清空 UI
            document.getElementById('highlightsList').innerHTML = '';
            document.getElementById('itineraryList').innerHTML = '';

            // 填寫基本資料
            showModal();
            document.getElementById('title').value = title;
            document.getElementById('price').value = price;
            document.getElementById('airline').value = airline;
            document.getElementById('description').value = descriptionBlock;

            // 填充每日行程列
            for (let i = 1; i < dayBlocks.length; i++) {
                const block = dayBlocks[i].trim();
                const blockLines = block.split('\n').map(l => l.trim()).filter(l => l);

                let dayTitle = blockLines[0] || "精彩行程";
                let breakfast = "", lunch = "", dinner = "", hotel = "", spots = [];

                blockLines.forEach(line => {
                    if (line.includes("早餐：")) breakfast = line.split('：')[1];
                    else if (line.includes("午餐：")) lunch = line.split('：')[1];
                    else if (line.includes("晚餐：")) dinner = line.split('：')[1];
                    else if (line.includes("住宿：")) hotel = line.split('：')[1];
                    else if (line.includes("→")) {
                        spots.push(...line.split('→').map(s => s.trim()));
                    } else if (line.length > 2 && line.length < 40 && line !== dayTitle) {
                        spots.push(line);
                    }
                });

                addItineraryRow({
                    day: i,
                    title: dayTitle,
                    spots: [...new Set(spots)],
                    breakfast, lunch, dinner, hotel
                });
            }

            // 若沒抓到行程 (例如天數抓錯)，補齊空白模板
            if (dayBlocks.length <= 1) {
                for (let i = 1; i <= dayCount; i++) addItineraryRow({ day: i });
            }

            addHighlightRow({ title: '精選秘境行程', desc: '特色', img: '' });
            alert(`智慧解析完成！\n識別天數：${dayBlocks.length - 1 || dayCount} 天\n識別航空：${airline}`);
        }

        // --- 核心：儲存時將表單轉回 JSON ---

        document.getElementById('tourForm').onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;

            try {
                const tags = document.getElementById('tagsInput').value.split(/[,，\s]+/).filter(t => t).map(t => stripEmojis(t));

                const highlights = Array.from(document.querySelectorAll('#highlightsList .dynamic-row')).map(row => ({
                    title: stripEmojis(row.querySelector('.h-title').value),
                    desc: stripEmojis(row.querySelector('.h-desc').value),
                    img: row.querySelector('.h-img').value
                })).filter(h => h.title);

                const itinerary = Array.from(document.querySelectorAll('#itineraryList .dynamic-row')).map((row, index) => ({
                    day: index + 1,
                    title: stripEmojis(row.querySelector('.i-title').value),
                    spots: row.querySelector('.i-spots').value.split('\n').filter(s => s.trim()).map(s => stripEmojis(s)),
                    breakfast: stripEmojis(row.querySelector('.i-breakfast').value),
                    lunch: stripEmojis(row.querySelector('.i-lunch').value),
                    dinner: stripEmojis(row.querySelector('.i-dinner').value),
                    hotel: stripEmojis(row.querySelector('.i-hotel').value)
                }));

                const payload = {
                    title: stripEmojis(document.getElementById('title').value),
                    price: parseInt(document.getElementById('price').value || 0),
                    airline: stripEmojis(document.getElementById('airline').value),
                    image: document.getElementById('image').value,
                    description: stripEmojis(document.getElementById('description').value),
                    tags: tags,
                    highlights: highlights,
                    itinerary: itinerary
                };

                const id = document.getElementById('tourId').value;
                const action = id ? _supabase.from('tours').update(payload).eq('id', id) : _supabase.from('tours').insert([payload]);

                const { error } = await action;
                if (error) throw error;

                alert("同步至官網成功！");
                closeModal();
                fetchTours();
            } catch (err) {
                alert("錯誤：" + err.message);
            } finally {
                saveBtn.disabled = false;
            }
        };

        // --- CRUD 基本功能 ---

        async function fetchTours() {
            const { data } = await _supabase.from('tours').select('*').order('id', { ascending: false });
            document.getElementById('tourTableBody').innerHTML = data.map(t => `
                <tr>
                    <td style="padding:15px;"><b>${t.title}</b></td>
                    <td>${t.airline || '---'}</td>
                    <td>$${Number(t.price).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-primary" onclick='editTour(${JSON.stringify(t)})'>編輯</button>
                        <button class="btn" style="color:red; background:none;" onclick="deleteTour(${t.id})">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function editTour(t) {
            showModal();
            document.getElementById('tourId').value = t.id;
            document.getElementById('title').value = t.title;
            document.getElementById('price').value = t.price;
            document.getElementById('airline').value = t.airline || "";
            document.getElementById('image').value = t.image || "";
            document.getElementById('description').value = t.description || "";
            document.getElementById('tagsInput').value = (t.tags || []).join(', ');

            document.getElementById('highlightsList').innerHTML = '';
            (t.highlights || []).forEach(h => addHighlightRow(h));

            document.getElementById('itineraryList').innerHTML = '';
            (t.itinerary || []).forEach(i => addItineraryRow(i));
        }

        async function deleteTour(id) { if (confirm("確定刪除行程？")) { await _supabase.from('tours').delete().eq('id', id); fetchTours(); } }
        function showModal() { document.getElementById('tourModal').classList.add('show'); document.getElementById('tourForm').reset(); document.getElementById('highlightsList').innerHTML = ''; document.getElementById('itineraryList').innerHTML = ''; }
        function closeModal() { document.getElementById('tourModal').classList.remove('show'); }

        fetchTours();
    </script>
</body>

</html>
