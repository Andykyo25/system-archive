<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>找到了旅行社 - 行程管理中心 (格式修復版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #d63384;
            --primary-dark: #a61e61;
            --dark: #1a1a2e;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            background: #f0f2f5;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--dark);
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .nav-item {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .nav-item.active {
            background: var(--primary);
            opacity: 1;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
            flex: 1;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        #quickPasteText {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 15px;
            background: var(--light);
            color: var(--text-secondary);
            font-weight: 700;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .tour-img-preview {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
            background: #eee;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-edit {
            background: #2f3542;
            color: white;
        }

        .btn-info {
            background: #0097e6;
            color: white;
            width: 100%;
            justify-content: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 850px;
            max-height: 90vh;
            border-radius: 20px;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        label {
            font-weight: 700;
            color: var(--dark);
            display: block;
            margin-top: 10px;
        }

        .img-preview-container {
            margin-top: 10px;
            width: 100%;
            height: 180px;
            border: 2px dashed #ddd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .img-preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-preview-container span {
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>找到管理後台</h2>
        <div class="nav-item active"><i class="fa-solid fa-map-location-dot"></i> 行程管理</div>
        <div class="nav-item" onclick="window.open('index.html')"><i class="fa-solid fa-house"></i> 前往首頁</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>行程管理中心</h1>
            <button class="btn btn-primary" onclick="showModal()"><i class="fa-solid fa-plus"></i> 手動新增</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-bolt" style="color:#fbc531"></i> 快速文案解析</h3>
            <textarea id="quickPasteText" placeholder="在此貼上 LINE 或 FB 廣告文案..."></textarea>
            <button class="btn btn-info" onclick="parseQuickText()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 自動識別並填入表單
            </button>
        </div>

        <div class="card">
            <table id="tourTable">
                <thead>
                    <tr>
                        <th>預覽</th>
                        <th>行程標題</th>
                        <th>最低價格</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tourTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="tourModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">編輯行程資料</h2>
            <form id="tourForm">
                <input type="hidden" id="tourId">
                <label>行程標題</label>
                <input type="text" id="title" required>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div><label>最低價格 (數字)</label><input type="number" id="price" required></div>
                    <div>
                        <label>封面圖片網址</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="image" placeholder="https://..." oninput="updatePreview()">
                            <button type="button" class="btn btn-info" onclick="setRandomImage()"
                                style="margin: 8px 0 15px; padding: 0 15px; white-space: nowrap;">
                                <i class="fa-solid fa-image"></i> 隨機圖
                            </button>
                        </div>
                    </div>
                </div>

                <div class="img-preview-container" id="imgPreview">
                    <span>圖片預覽區</span>
                </div>

                <label>標籤 (JSON 格式陣列)</label>
                <input type="text" id="tags">

                <label>行程亮點 (JSON 格式陣列)</label>
                <textarea id="highlights" rows="6"></textarea>

                <label>廣告備註 (文字說明)</label>
                <textarea id="description" rows="5"></textarea>

                <label>每日行程明細 (JSON 格式陣列)</label>
                <textarea id="itinerary" rows="3"></textarea>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">儲存並同步</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://luozejormlpayqbcvwis.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b3plam9ybWxwYXlxYmN2d2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3NTY4NDQsImV4cCI6MjA4NjMzMjg0NH0.ASyVqZRPZeZtGKB2r_P0fEOhVczY0eptpHHy7jff08c";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // 快速解析
        function parseQuickText() {
            try {
                const raw = document.getElementById('quickPasteText').value;
                if (!raw.trim()) return alert("請貼上文案");

                const lines = raw.split('\n').map(l => l.trim()).filter(l => l);

                // 1. 標題處理: 移除開頭和結尾的裝飾性 Emoji，但保留中文/日文/韓文等文字
                // \p{Extended_Pictographic} 需要配合 u 旗標
                const emojiCleanRegex = /^\p{Extended_Pictographic}+|\p{Extended_Pictographic}+$/gu;
                let title = lines[0].replace(emojiCleanRegex, "").trim();
                if (!title) title = lines[0].substring(0, 30);

                // 2. 價格處理: 強化正則，捕捉多種格式
                const priceRegex = /(?:團費：|只要|價：|NT\$|\$|費用：)\s?(\d{1,3}(?:,\d{3})*)/gi;
                let minPrice = Infinity;
                let match;
                while ((match = priceRegex.exec(raw)) !== null) {
                    const val = parseInt(match[1].replace(/,/g, ''));
                    if (!isNaN(val) && val < minPrice) minPrice = val;
                }

                // 3. 標籤與亮點
                const tagsObj = [];
                const highlightsObj = [];
                let currentCat = "特色";

                lines.forEach(line => {
                    // 抓標籤: 帶圖示且長度較短的行
                    if (line.match(/^[\u2700-\u27bf\u1f300-\u1f5ff\u1f600-\u1f64f\u1f680-\u1f6ff\u2600-\u26ff]/) && line.length < 25) {
                        const cleanedTag = line.replace(/^\p{Extended_Pictographic}+\s*/u, "").substring(0, 15).trim();
                        if (cleanedTag && !tagsObj.includes(cleanedTag)) {
                            tagsObj.push(cleanedTag);
                        }
                    }

                    // 判斷分類目錄
                    if (line.includes("必玩") || line.includes("行程") || line.includes("體驗")) currentCat = "玩樂";
                    if (line.includes("必吃") || line.includes("美食") || line.includes("風味")) currentCat = "美食";
                    if (line.includes("住") || line.includes("飯店") || line.includes("住宿")) currentCat = "住宿";

                    // 抓亮點: 使用 Emoji 開頭的項目
                    // 這裡使用 unicode property escape 偵測開頭 Emoji
                    if (/^\p{Extended_Pictographic}/u.test(line)) {
                        const highlightTitle = line.replace(/^\p{Extended_Pictographic}+\s*/u, "").substring(0, 20).trim();
                        if (highlightTitle && highlightTitle.length > 1) {
                            highlightsObj.push({
                                title: highlightTitle,
                                desc: currentCat,
                                img: ""
                            });
                        }
                    }
                });

                // 4. 備註/描述處理: 尋找團費或航班資訊開始的地方
                const descKeywords = ["【團費", "航班資訊", "出發日期", "機型"];
                let descStartIndex = -1;
                for (const kw of descKeywords) {
                    const idx = raw.indexOf(kw);
                    if (idx !== -1 && (descStartIndex === -1 || idx < descStartIndex)) {
                        descStartIndex = idx;
                    }
                }

                const description = descStartIndex !== -1 ? raw.substring(descStartIndex).trim() : raw;

                // 填入表單
                showModal();
                document.getElementById('modalTitle').innerText = "新增行程 (自動解析)";
                document.getElementById('tourId').value = ""; // 清空 ID
                document.getElementById('title').value = title;
                document.getElementById('price').value = (minPrice === Infinity) ? 0 : minPrice;
                document.getElementById('tags').value = JSON.stringify(tagsObj);
                document.getElementById('highlights').value = JSON.stringify(highlightsObj, null, 2);
                document.getElementById('description').value = description;
                document.getElementById('itinerary').value = "[]";

                alert("解析成功！請核對各項資料是否有誤。");
            } catch (err) {
                console.error(err);
                alert("解析失敗，請手動輸入或檢查格式。\n錯誤細節: " + err.message);
            }
        }
        // 載入列表
        async function fetchTours() {
            const { data } = await _supabase.from('tours').select('*').order('id', { ascending: false });
            document.getElementById('tourTableBody').innerHTML = data.map(t => `
                <tr>
                    <td><img src="${t.image || FALLBACK_IMG}" class="tour-img-preview"></td>
                    <td>${t.title}</td>
                    <td>$${Number(t.price).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-edit" onclick='editTour(${JSON.stringify(t)})'>修改</button>
                        <button class="btn btn-danger" onclick="deleteTour(${t.id})|">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 儲存邏輯
        document.getElementById('tourForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.submitter;
            btn.disabled = true;
            btn.innerText = "儲存中...";

            try {
                const id = document.getElementById('tourId').value;

                // 核心修正：使用 JSON.parse 驗證並清理格式
                const tagsVal = document.getElementById('tags').value.trim() || "[]";
                const highVal = document.getElementById('highlights').value.trim() || "[]";
                const itinVal = document.getElementById('itinerary').value.trim() || "[]";

                const payload = {
                    title: document.getElementById('title').value,
                    price: parseInt(document.getElementById('price').value || 0),
                    image: document.getElementById('image').value,
                    tags: JSON.parse(tagsVal),
                    highlights: JSON.parse(highVal),
                    description: document.getElementById('description').value,
                    itinerary: JSON.parse(itinVal)
                };

                const action = id
                    ? _supabase.from('tours').update(payload).eq('id', id)
                    : _supabase.from('tours').insert([payload]);

                const { error } = await action;
                if (error) throw error;

                alert("雲端儲存成功！");
                closeModal();
                fetchTours();
            } catch (err) {
                alert("儲存失敗：JSON 格式錯誤。\n請檢查輸入的 [ ] 是否完整。\n錯誤訊息: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "儲存並同步";
            }
        };

        async function deleteTour(id) {
            if (confirm("確定刪除？")) { await _supabase.from('tours').delete().eq('id', id); fetchTours(); }
        }

        function editTour(t) {
            showModal();
            document.getElementById('modalTitle').innerText = "修改行程資料";
            document.getElementById('tourId').value = t.id;
            document.getElementById('title').value = t.title;
            document.getElementById('price').value = t.price;
            document.getElementById('image').value = t.image || "";
            document.getElementById('tags').value = JSON.stringify(t.tags || []);
            document.getElementById('highlights').value = JSON.stringify(t.highlights || [], null, 2);
            document.getElementById('description').value = t.description || "";
            document.getElementById('itinerary').value = JSON.stringify(t.itinerary || [], null, 2);
            updatePreview();
        }

        function showModal() {
            document.getElementById('tourModal').classList.add('show');
            updatePreview();
        }
        function closeModal() {
            document.getElementById('tourModal').classList.remove('show');
            document.getElementById('tourForm').reset();
            document.getElementById('tourId').value = "";
            updatePreview();
        }

        // 圖片預覽與隨機圖
        const FALLBACK_IMG = "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=800";
        const TRAVEL_IMGS = [
            "https://images.unsplash.com/photo-1503220317375-aaad61436b1b?q=80&w=800",
            "https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=800",
            "https://images.unsplash.com/photo-1527631746610-bca00a040d60?q=80&w=800",
            "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=800",
            "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=800",
            "https://images.unsplash.com/photo-1493246507139-91e8bef99c02?q=80&w=800"
        ];

        function updatePreview() {
            const url = document.getElementById('image').value;
            const container = document.getElementById('imgPreview');
            if (url) {
                container.innerHTML = `<img src="${url}" onerror="this.src='${FALLBACK_IMG}'">`;
            } else {
                container.innerHTML = `<span>圖片預覽區</span>`;
            }
        }

        function setRandomImage() {
            const randomImg = TRAVEL_IMGS[Math.floor(Math.random() * TRAVEL_IMGS.length)];
            document.getElementById('image').value = randomImg;
            updatePreview();
        }

        fetchTours();
    </script>
</body>

</html>
