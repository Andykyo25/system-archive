<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>找到了旅行社 - 行程管理中心 (旗艦升級版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #d63384;
            --primary-dark: #a61e61;
            --dark: #1a1a2e;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            background: #f0f2f5;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--dark);
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .nav-item {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .nav-item.active {
            background: var(--primary);
            opacity: 1;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
            flex: 1;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        #quickPasteText {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 15px;
            background: var(--light);
            color: var(--text-secondary);
            font-weight: 700;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .tour-img-preview {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
            background: #eee;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-edit {
            background: #2f3542;
            color: white;
        }

        .btn-info {
            background: #0097e6;
            color: white;
            width: 100%;
            justify-content: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            border-radius: 20px;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        label {
            font-weight: 700;
            color: var(--dark);
            display: block;
            margin-top: 10px;
        }

        .img-preview-container {
            width: 100%;
            height: 150px;
            border: 1px solid #eee;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .img-preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>找到管理後台</h2>
        <div class="nav-item active"><i class="fa-solid fa-map-location-dot"></i> 行程管理</div>
        <div class="nav-item" onclick="window.open('index.html')"><i class="fa-solid fa-house"></i> 前往首頁</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>行程管理中心</h1>
            <button class="btn btn-primary" onclick="showModal()"><i class="fa-solid fa-plus"></i> 手動新增行程</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-bolt" style="color:#fbc531"></i> 快速文案解析 (LINE/FB 廣告)</h3>
            <textarea id="quickPasteText" placeholder="在此貼上廣告文案..."></textarea>
            <button class="btn btn-info" onclick="parseQuickText()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 智能識別文案內容
            </button>
        </div>

        <div class="card">
            <table id="tourTable">
                <thead>
                    <tr>
                        <th>預覽</th>
                        <th>行程標題</th>
                        <th>航空公司</th>
                        <th>價格</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tourTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="tourModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">行程編輯</h2>
            <form id="tourForm">
                <input type="hidden" id="tourId">

                <label>行程標題</label>
                <input type="text" id="title" required>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                    <div><label>最低價格 (數字)</label><input type="number" id="price" required></div>
                    <div><label>航空公司</label><input type="text" id="airline" placeholder="如：土耳其航空"></div>
                    <div><label>封面圖片</label><input type="text" id="image" placeholder="圖片網址" oninput="updatePreview()">
                    </div>
                </div>

                <div class="img-preview-container" id="imgPreview"><span>圖片預覽</span></div>

                <label>行程標籤 (JSON)</label>
                <input type="text" id="tags">

                <label>行程亮點 (JSON)</label>
                <textarea id="highlights" rows="4"></textarea>

                <label>每日行程明細 (JSON - 包含餐食與住宿)</label>
                <textarea id="itinerary" rows="8"></textarea>

                <label>費用說明 / 注意事項</label>
                <textarea id="description" rows="4"></textarea>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">儲存並同步</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://luozejormlpayqbcvwis.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b3plam9ybWxwYXlxYmN2d2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3NTY4NDQsImV4cCI6MjA4NjMzMjg0NH0.ASyVqZRPZeZtGKB2r_P0fEOhVczY0eptpHHy7jff08c";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);
        const FALLBACK_IMG = "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=800";

        // 快速文案解析
        function parseQuickText() {
            try {
                const raw = document.getElementById('quickPasteText').value;
                if (!raw.trim()) return alert("請貼上文案");

                const lines = raw.split('\n').map(l => l.trim()).filter(l => l);

                // 1. 標題與航空
                let title = lines[0].replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s]/g, "").trim();
                let airline = "精選航空";
                const airlineMatch = raw.match(/(航空公司：|航空公司:)\s?([^\n\s]+)/);
                if (airlineMatch) airline = airlineMatch[2];

                // 2. 價格 (取最小值)
                const priceRegex = /(?:團費：|只要|價：|\$)\s?(\d{1,3}(?:,\d{3})*)/g;
                let minPrice = Infinity;
                let m;
                while ((m = priceRegex.exec(raw)) !== null) {
                    const val = parseInt(m[1].replace(/,/g, ''));
                    if (val < minPrice) minPrice = val;
                }

                // 3. 標籤與亮點
                const tags = [];
                const highlights = [];
                let currentCat = "精選亮點";

                lines.forEach(line => {
                    if (line.match(/^[📌🚫✨✅🌊🚫🏨🎠🍽]/)) {
                        const content = line.substring(2).trim();
                        if (content.length < 15) tags.push(content);
                        else highlights.push({ title: content.substring(0, 15), desc: currentCat, img: "" });
                    }
                    if (line.includes("必玩") || line.includes("行程")) currentCat = "玩樂行程";
                    if (line.includes("必吃") || line.includes("美食")) currentCat = "道地美食";
                    if (line.includes("住宿") || line.includes("飯店")) currentCat = "優質住宿";
                });

                // 4. 備註 (自動切割出日期區塊)
                const dateIndex = raw.indexOf("【團費");
                const description = dateIndex !== -1 ? raw.substring(dateIndex).trim() : raw;

                // 5. 行程明細模板 (自動生成天數，方便手動填入)
                const dayMatch = raw.match(/天數：(\d+)天/);
                const dayCount = dayMatch ? parseInt(dayMatch[1]) : 5;
                const itineraryTemplate = [];
                for (let i = 1; i <= dayCount; i++) {
                    itineraryTemplate.push({ day: i, title: `第${i}天行程名稱`, spots: [], breakfast: "", lunch: "", dinner: "", hotel: "" });
                }

                showModal();
                document.getElementById('title').value = title;
                document.getElementById('price').value = (minPrice === Infinity) ? 0 : minPrice;
                document.getElementById('airline').value = airline;
                document.getElementById('tags').value = JSON.stringify(tags.slice(0, 6));
                document.getElementById('highlights').value = JSON.stringify(highlights.slice(0, 8), null, 2);
                document.getElementById('itinerary').value = JSON.stringify(itineraryTemplate, null, 2);
                document.getElementById('description').value = description;

                alert("解析成功！已建立旗艦版結構，請補齊每日詳細行程、餐食與圖片。");
            } catch (err) {
                alert("解析錯誤：" + err.message);
            }
        }

        async function fetchTours() {
            const { data } = await _supabase.from('tours').select('*').order('id', { ascending: false });
            document.getElementById('tourTableBody').innerHTML = data.map(t => `
                <tr>
                    <td><img src="${t.image || FALLBACK_IMG}" class="tour-img-preview"></td>
                    <td><b>${t.title}</b></td>
                    <td>${t.airline || '---'}</td>
                    <td>$${Number(t.price).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-edit" onclick='editTour(${JSON.stringify(t)})'><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-danger" onclick="deleteTour(${t.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('tourForm').onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;

            try {
                const id = document.getElementById('tourId').value;
                const payload = {
                    title: document.getElementById('title').value,
                    price: parseInt(document.getElementById('price').value),
                    airline: document.getElementById('airline').value,
                    image: document.getElementById('image').value,
                    tags: JSON.parse(document.getElementById('tags').value || "[]"),
                    highlights: JSON.parse(document.getElementById('highlights').value || "[]"),
                    itinerary: JSON.parse(document.getElementById('itinerary').value || "[]"),
                    description: document.getElementById('description').value
                };

                const action = id ? _supabase.from('tours').update(payload).eq('id', id) : _supabase.from('tours').insert([payload]);
                const { error } = await action;
                if (error) throw error;

                alert("同步成功！"); closeModal(); fetchTours();
            } catch (err) {
                alert("錯誤：" + err.message);
            } finally {
                saveBtn.disabled = false;
            }
        };

        function editTour(t) {
            showModal();
            document.getElementById('tourId').value = t.id;
            document.getElementById('title').value = t.title;
            document.getElementById('price').value = t.price;
            document.getElementById('airline').value = t.airline || "精選航空";
            document.getElementById('image').value = t.image || "";
            document.getElementById('tags').value = JSON.stringify(t.tags || []);
            document.getElementById('highlights').value = JSON.stringify(t.highlights || [], null, 2);
            document.getElementById('itinerary').value = JSON.stringify(t.itinerary || [], null, 2);
            document.getElementById('description').value = t.description || "";
            updatePreview();
        }

        async function deleteTour(id) {
            if (confirm("確定刪除此行程？")) {
                await _supabase.from('tours').delete().eq('id', id);
                fetchTours();
            }
        }

        function updatePreview() {
            const url = document.getElementById('image').value;
            document.getElementById('imgPreview').innerHTML = url ? `<img src="${url}">` : `<span>圖片預覽</span>`;
        }

        function showModal() { document.getElementById('tourModal').classList.add('show'); }
        function closeModal() { document.getElementById('tourModal').classList.remove('show'); document.getElementById('tourForm').reset(); }

        fetchTours();
    </script>
</body>

</html>
