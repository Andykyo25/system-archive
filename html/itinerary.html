<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">讀取行程中... | 找到了旅行社</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #d63384;
            --primary-dark: #a61e61;
            --accent: #ffc107;
            --bg-body: #f4f7f9;
            --text-main: #2d3436;
            --text-secondary: #636e72;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: white;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Hero */
        .hero {
            position: relative;
            height: 50vh;
            min-height: 400px;
            margin-top: 60px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            color: white;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .hero-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag-pill {
            background: var(--primary);
            color: white;
            padding: 4px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 900;
            line-height: 1.3;
        }

        /* Stats Area (修正為3欄) */
        .quick-stats {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            margin-top: -50px;
            position: relative;
            z-index: 5;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            border-right: 1px solid #eee;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-item small {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .stat-item strong {
            font-size: 1.1rem;
            color: var(--primary-dark);
            font-weight: 900;
        }

        /* Tabs (Sticky) */
        .tabs {
            position: sticky;
            top: 65px;
            background: white;
            z-index: 100;
            border-bottom: 2px solid #eee;
            margin: 30px 0;
            display: flex;
            justify-content: center;
        }

        .tab-link {
            padding: 15px 20px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
        }

        .tab-link.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Generic Detail Card */
        .detail-card {
            background: white;
            border-radius: var(--radius);
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .section-header {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 30px;
            border-left: 6px solid var(--primary);
            padding-left: 15px;
        }

        /* Highlights (Zig-Zag) */
        .highlight-item {
            display: flex;
            gap: 40px;
            margin-bottom: 60px;
            align-items: center;
        }

        .highlight-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .highlight-img {
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            height: 320px;
            box-shadow: var(--shadow);
        }

        .highlight-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .highlight-text {
            flex: 1.2;
        }

        .highlight-text h3 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        /* Itinerary Style */
        .day-group {
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .day-header {
            background: #2d3436;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .day-body {
            background: white;
            padding: 25px;
        }

        .day-title {
            font-size: 1.25rem;
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .spot-item {
            margin-bottom: 8px;
            color: #444;
            position: relative;
            padding-left: 25px;
        }

        .spot-item::before {
            content: '\f058';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f1f1f1;
        }

        .info-box {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .info-box strong {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Bottom Fixed Bar */
        .booking-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 15px 0;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
        }

        .booking-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-price {
            color: var(--primary);
            font-weight: 900;
            font-size: 1.8rem;
        }

        .booking-price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 5px;
        }

        .btn-booking {
            background: var(--primary);
            color: white;
            padding: 12px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .quick-stats {
                grid-template-columns: 1fr;
            }

            .stat-item {
                border-right: none;
                border-bottom: 1px solid #eee;
                padding: 10px 0;
            }

            .highlight-item,
            .highlight-item:nth-child(even) {
                flex-direction: column;
                gap: 20px;
            }

            .highlight-img {
                height: 220px;
                width: 100%;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fa-solid fa-earth-asia"></i> 找到了旅行社</a>
            <div style="display:flex; gap:15px; align-items:center;">
                <a href="tel:0920096680" style="color:var(--text-main); text-decoration:none; font-weight:700;"><i
                        class="fa-solid fa-phone"></i></a>
                <a href="https://lin.ee/SSbI3BB"
                    style="background:#00c300; color:white; padding:5px 12px; border-radius:20px; font-size:0.8rem; text-decoration:none;">LINE諮詢</a>
            </div>
        </div>
    </nav>

    <section class="hero" id="heroBg">
        <div class="container hero-content">
            <div class="hero-tags" id="tourTags"></div>
            <h1 id="tourTitle">正在為您準備精彩行程...</h1>
        </div>
    </section>

    <div class="container">
        <!-- 行程摘要 (修正為3格) -->
        <div class="quick-stats">
            <div class="stat-item">
                <small><i class="fa-regular fa-calendar"></i> 行程天數</small>
                <strong id="statDays">-- 天</strong>
            </div>
            <div class="stat-item">
                <small><i class="fa-solid fa-plane"></i> 航空公司</small>
                <strong id="statAirlines">載入中...</strong>
            </div>
            <div class="stat-item">
                <small><i class="fa-solid fa-hotel"></i> 飯店等級</small>
                <strong>精選 4~5 星</strong>
            </div>
        </div>

        <!-- Sticky Tabs 選單 -->
        <nav class="tabs">
            <a href="#section-highlights" class="tab-link active">行程亮點</a>
            <a href="#section-itinerary" class="tab-link">詳細行程</a>
            <a href="#section-notes" class="tab-link">報名須知</a>
        </nav>

        <!-- 行程特色亮點 -->
        <section id="section-highlights" class="detail-card">
            <h2 class="section-header">行程亮點特色</h2>
            <div id="tourHighlights"></div>
        </section>

        <!-- 每日行程 -->
        <section id="section-itinerary">
            <h2 class="section-header">每日精彩行程</h2>
            <div id="tourTimeline"></div>
        </section>

        <!-- 費用說明 -->
        <section id="section-notes" class="detail-card">
            <h2 class="section-header">費用包含與注意事項</h2>
            <div class="info-grid" style="border:none; padding:0; margin:0;">
                <div class="info-box">
                    <strong><i class="fa-solid fa-circle-check" style="color:green"></i> 費用包含</strong>
                    <ul style="font-size:0.85rem; padding-left:15px; color:var(--text-secondary); list-style:disc;">
                        <li>機票：團體經濟艙來回機票。</li>
                        <li>稅金：機場稅、燃油附加費。</li>
                        <li>住宿：行程所列之優質飯店。</li>
                        <li>行李：每人 20kg 託運行李。</li>
                    </ul>
                </div>
                <div class="info-box">
                    <strong><i class="fa-solid fa-circle-xmark" style="color:red"></i> 費用不包含</strong>
                    <ul style="font-size:0.85rem; padding-left:15px; color:var(--text-secondary); list-style:disc;">
                        <li>規費：個人護照、簽證費用。</li>
                        <li>小費：床頭小費、領隊司機小費。</li>
                        <li>其他：個人私人消費、純屬私人支出。</li>
                    </ul>
                </div>
            </div>
            <div style="margin-top:25px; font-size:0.9rem; color:#666; border-top:1px solid #eee; padding-top:20px;">
                <strong>💡 專員備註：</strong><br>
                <div id="tourDescription" style="white-space: pre-line; margin-top:10px;"></div>
            </div>
        </section>
    </div>

    <!-- 底部預約列 -->
    <div class="booking-bar">
        <div class="container booking-content">
            <div class="booking-price">
                <span id="bookingPrice">---</span><small>起 / 含稅</small>
            </div>
            <a href="https://lin.ee/SSbI3BB" class="btn-booking">立即預約報名</a>
        </div>
    </div>

    <script>
        const SB_URL = "https://luozejormlpayqbcvwis.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b3plam9ybWxwYXlxYmN2d2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3NTY4NDQsImV4cCI6MjA4NjMzMjg0NH0.ASyVqZRPZeZtGKB2r_P0fEOhVczY0eptpHHy7jff08c";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        async function fetchTourDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');
            if (!tourId) return;

            const { data: tour, error } = await _supabase.from('tours').select('*').eq('id', tourId).single();
            if (error || !tour) return;

            // 1. 基本資訊
            document.title = `${tour.title} | 找到了旅行社`;
            document.getElementById('tourTitle').innerText = tour.title;
            document.getElementById('bookingPrice').innerText = `$${Number(tour.price).toLocaleString()}`;
            document.getElementById('heroBg').style.backgroundImage = `url('${tour.image || ''}')`;
            document.getElementById('tourDescription').innerText = tour.description || "";

            // 2. 統計摘要連動
            document.getElementById('statDays').innerText = `${tour.itinerary?.length || '--'} 天`;
            document.getElementById('statAirlines').innerText = tour.airline || "精選航空";

            // 3. 標籤
            if (tour.tags) {
                document.getElementById('tourTags').innerHTML = tour.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
            }

            // 4. 行程亮點 (Zig-Zag)
            if (tour.highlights) {
                document.getElementById('tourHighlights').innerHTML = tour.highlights.map(h => `
                    <div class="highlight-item">
                        <div class="highlight-img"><img src="${h.img || 'https://via.placeholder.com/600x400?text=精選特色'}" loading="lazy"></div>
                        <div class="highlight-text">
                            <h3>${h.title}</h3>
                            <p>${h.desc || '專業規劃的深度行程，帶您領略在地文化之美。'}</p>
                        </div>
                    </div>
                `).join('');
            }

            // 5. 每日行程
            if (tour.itinerary) {
                document.getElementById('tourTimeline').innerHTML = tour.itinerary.map(day => `
                    <div class="day-group">
                        <div class="day-header">
                            <span>第 ${day.day} 天</span>
                            <small><i class="fa-solid fa-location-dot"></i> 當地遊覽</small>
                        </div>
                        <div class="day-body">
                            <h3 class="day-title"><i class="fa-solid fa-plane-arrival"></i> ${day.title}</h3>
                            <div style="margin-bottom:15px;">
                                ${day.spots.map(s => `<div class="spot-item">${s}</div>`).join('')}
                            </div>
                            <div class="info-grid">
                                <div class="info-box">
                                    <strong>🍱 今日餐食</strong>
                                    早：${day.breakfast || '飯店內享用'} / 
                                    午：${day.lunch || '在地風味料理'} / 
                                    晚：${day.dinner || '敬請自理'}
                                </div>
                                <div class="info-box">
                                    <strong>🏠 下榻飯店</strong>
                                    ${day.hotel || '精選優質 4-5 星飯店或同級'}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 滾動偵測 Tabs
        window.addEventListener('scroll', () => {
            const sections = ['section-highlights', 'section-itinerary', 'section-notes'];
            const scrollPos = window.scrollY + 100;
            sections.forEach(id => {
                const el = document.getElementById(id);
                if (el && scrollPos >= el.offsetTop && scrollPos < (el.offsetTop + el.offsetHeight)) {
                    document.querySelectorAll('.tab-link').forEach(link => link.classList.remove('active'));
                    const activeLink = document.querySelector(`.tab-link[href="#${id}"]`);
                    if (activeLink) activeLink.classList.add('active');
                }
            });
        });

        fetchTourDetails();
    </script>
</body>

</html>
